[package]
name = "Stiqka"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
eframe = { version = "0.32", features = ["default_fonts"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rfd = "0.14"
image = "0.25"
once_cell = "1.19"
zip = "2.3.0"
webp = "0.3"

[build-dependencies]
embed-resource = "2.4"