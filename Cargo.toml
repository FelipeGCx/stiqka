[package]
name = "sfwa"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.32", features = ["default_fonts"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rfd = "0.14"
image = "0.25"
once_cell = "1.19"
flate2 = "1"
crc32fast = "1"
zip = "2.3.0"
webp = "0.3"